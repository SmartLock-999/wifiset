<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGate · WiFi & 供裝設定</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  :root {
    --bg:#0d0f14; --surface:#161922; --border:#252a35;
    --accent:#00e5a0; --accent2:#0099ff;
    --text:#e8eaf0; --muted:#5a6070;
    --error:#ff4d6a; --warn:#ffb74d;
    --radius:12px;
    --mono:'JetBrains Mono',monospace; --sans:'Noto Sans TC',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}
  header{width:100%;max-width:440px;display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .logo{width:42px;height:42px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:10px;display:flex;align-items:center;justify-content:center}
  .logo svg{width:22px;height:22px}
  header h1{font-size:1.05rem;font-weight:700}
  header p{font-size:.72rem;color:var(--muted);margin-top:2px;font-family:var(--mono)}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:18px}
  .status-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;
    background:#1a1d26;border:1px solid var(--border);font-family:var(--mono);font-size:.78rem}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
  .dot.connected{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .dot.connecting{background:var(--warn);animation:pulse 1s infinite}
  .dot.error{background:var(--error)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #statusText{color:var(--muted);flex:1;font-size:.75rem}
  .label{font-size:.68rem;font-family:var(--mono);color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .field{display:flex;flex-direction:column;gap:6px}
  .ssid-row{display:flex;gap:8px;align-items:stretch}
  .ssid-row select{flex:1;min-width:0;background:#1a1d26;border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.85rem;
    padding:11px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;cursor:pointer}
  .ssid-row select:focus{border-color:var(--accent2)}
  .ssid-row select option{background:#1a1d26}
  #customSsidWrap{display:none;margin-top:6px}
  #customSsid{width:100%;background:#1a1d26;border:1px solid var(--accent2);
    border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.85rem;
    padding:11px 12px;outline:none}
  .btn-scan{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:8px;
    color:var(--accent2);font-family:var(--sans);font-weight:600;font-size:.78rem;
    padding:0 14px;cursor:pointer;display:flex;align-items:center;gap:6px;
    transition:border-color .2s,opacity .2s;white-space:nowrap}
  .btn-scan:hover:not(:disabled){border-color:var(--accent2)}
  .btn-scan:disabled{opacity:.35;cursor:not-allowed}
  .btn-scan svg{width:15px;height:15px;flex-shrink:0}
  .btn-scan.scanning svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
  .sbadge{display:inline-block;font-family:var(--mono);font-size:.62rem;
    padding:1px 6px;border-radius:4px;background:#252a35;color:var(--muted);margin-left:4px}
  .sbadge.s{color:var(--accent)} .sbadge.m{color:var(--warn)} .sbadge.w{color:var(--error)}
  .input-wrap{position:relative;display:flex;align-items:center}
  .input-wrap input{width:100%;background:#1a1d26;border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.85rem;
    padding:11px 40px 11px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none}
  .input-wrap input:focus{border-color:var(--accent2)}
  .input-wrap input::placeholder{color:var(--muted)}
  .eye-btn{position:absolute;right:10px;background:none;border:none;cursor:pointer;
    color:var(--muted);display:flex;align-items:center;padding:4px}
  .eye-btn:hover{color:var(--text)}
  .btn{width:100%;padding:13px;border-radius:8px;border:none;font-family:var(--sans);
    font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.02em}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.3;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
  hr{border:none;border-top:1px solid var(--border)}
  .log-wrap{background:#10121a;border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .log-entry{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;gap:8px}
  .log-entry .ts{color:#2e3440;flex-shrink:0}
  .log-entry.ok .msg{color:var(--accent)} .log-entry.err .msg{color:var(--error)}
  .log-entry.warn .msg{color:var(--warn)} .log-entry.info .msg{color:var(--accent2)}
  #noSupport{display:none;background:#2a1520;border:1px solid var(--error);border-radius:8px;
    padding:14px;font-size:.8rem;color:var(--error);line-height:1.6;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>
  <div><h1>SmartGate WiFi 設定</h1><p>透過藍芽變更裝置連線與供裝設定</p></div>
</header>

<div class="card">
  <div id="noSupport">⚠️ 此瀏覽器不支援 Web Bluetooth<br>請使用 <strong>Android Chrome</strong> 或啟用 HTTPS。<br><br>iOS Safari 使用者請改用供裝模式：<br>快速插拔電源 3 次，連上「SmartGate-Setup」熱點後自動開啟設定頁面。</div>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="statusText">尚未連線</span>
    <button class="btn btn-secondary" id="btnConnect"
      style="padding:5px 14px;font-size:.75rem;width:auto;border-radius:6px;">連線</button>
  </div>

  <hr>

  <div class="field">
    <div class="label">WiFi 名稱（SSID）</div>
    <div class="ssid-row">
      <select id="ssidSelect" disabled>
        <option value="">── 請先連線裝置 ──</option>
      </select>
      <button class="btn-scan" id="btnScan" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M22 12A10 10 0 0 0 3.5 7.5M2 12a10 10 0 0 0 18.5 4.5"/>
        </svg>
        掃描
      </button>
    </div>
    <div id="customSsidWrap">
      <input type="text" id="customSsid" placeholder="輸入 WiFi 名稱" autocomplete="off" spellcheck="false">
    </div>
    <div class="hint" id="ssidHint" style="display:none"></div>
  </div>

  <div class="field">
    <div class="label">WiFi 密碼</div>
    <div class="input-wrap">
      <input type="password" id="passInput" placeholder="輸入 WiFi 密碼" autocomplete="off">
      <button class="eye-btn" id="eyeBtn" type="button">
        <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <hr>
  <div class="label">供裝設定（若留空則保持原值）</div>

  <div class="field">
    <div class="label">設備帳號</div>
    <input type="text" id="mqttUser" placeholder="請見說明書" autocomplete="off" readonly>
  </div>
  <div class="field">
    <div class="label">設備密碼</div>
    <div class="input-wrap">
      <input type="password" id="mqttPass" placeholder="請見說明書" autocomplete="off">
      <button class="eye-btn" id="eyeBtn2" type="button">
        <svg id="eyeIcon2" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="field">
    <div class="label">設備名稱 (Device ID)</div>
    <input type="text" id="deviceId" placeholder="例：大門、車庫" autocomplete="off">
  </div>
  <div class="field">
    <div class="label">註冊 Email</div>
    <input type="email" id="userEmail" placeholder="請輸入帳號 Email" autocomplete="off">
  </div>
  <div class="field">
    <div class="label">伺服器編號 (Server No)</div>
    <input type="text" id="serverNo" placeholder="請見說明書" autocomplete="off">
  </div>

  <button class="btn btn-primary" id="btnSend" disabled>套用並重啟裝置</button>
  <hr>
  <div>
    <div class="label" style="margin-bottom:8px">操作記錄</div>
    <div class="log-wrap" id="logWrap">
      <div class="log-entry info"><span class="ts">--:--:--</span><span class="msg">等待連線...</span></div>
    </div>
  </div>
</div>

<script>
const SVC_UUID    = '12345678-1234-5678-1234-56789abcdef0';
const SSID_UUID   = '12345678-1234-5678-1234-56789abcdef1';
const PASS_UUID   = '12345678-1234-5678-1234-56789abcdef2';
const CMD_UUID    = '12345678-1234-5678-1234-56789abcdef3';
const STATUS_UUID = '12345678-1234-5678-1234-56789abcdef4';
const SCAN_UUID   = '12345678-1234-5678-1234-56789abcdef5';
const MQTT_USER_UUID = '12345678-1234-5678-1234-56789abcde01';
const MQTT_PASS_UUID = '12345678-1234-5678-1234-56789abcde02';
const DEV_ID_UUID    = '12345678-1234-5678-1234-56789abcde03';
// 可額外使用 DEV_NAME_UUID = '...04' 但非必要
const EMAIL_UUID     = '12345678-1234-5678-1234-56789abcde05';
const SERVER_NO_UUID = '12345678-1234-5678-1234-56789abcde06';

let device, server, chars={}, connected=false, scanResults=[], currentSsid='';
const $=id=>document.getElementById(id);
const dot=$('dot'), statusText=$('statusText'), btnConnect=$('btnConnect'),
      btnScan=$('btnScan'), btnSend=$('btnSend'), ssidSelect=$('ssidSelect'),
      customSsid=$('customSsid'), customWrap=$('customSsidWrap'),
      passInput=$('passInput'), logWrap=$('logWrap'), ssidHint=$('ssidHint');

if(!navigator.bluetooth) $('noSupport').style.display='block';

function log(msg,type=''){
  const ts=new Date().toTimeString().slice(0,8);
  const el=document.createElement('div');
  el.className=`log-entry ${type}`;
  el.innerHTML=`<span class="ts">${ts}</span><span class="msg">${msg}</span>`;
  logWrap.appendChild(el); logWrap.scrollTop=logWrap.scrollHeight;
}
function sigCls(r){return r>=-60?'s':r>=-75?'m':'w'}
function sigBar(r){return r>=-60?'▂▄▆█':r>=-75?'▂▄▆·':'▂▄··'}

function buildDropdown(){
  ssidSelect.innerHTML='';
  if(currentSsid && !scanResults.find(r=>r.ssid===currentSsid)){
    const o=document.createElement('option');
    o.value=currentSsid; o.textContent=`${currentSsid}（目前設定）`; o.selected=true;
    ssidSelect.appendChild(o);
  }
  scanResults.forEach(({ssid,rssi})=>{
    const o=document.createElement('option');
    o.value=ssid;
    o.textContent=`${ssid}   ${sigBar(rssi)} ${rssi}dBm`;
    if(ssid===currentSsid) o.selected=true;
    ssidSelect.appendChild(o);
  });
  const m=document.createElement('option'); m.value='__manual__'; m.textContent='── 手動輸入 ──';
  ssidSelect.appendChild(m);
  ssidSelect.disabled=false;
  onSsidChange();
}
function onSsidChange(){
  const v=ssidSelect.value;
  customWrap.style.display=v==='__manual__'?'block':'none';
  if(v==='__manual__'){ssidHint.style.display='none'; customSsid.focus(); return;}
  const r=scanResults.find(x=>x.ssid===v);
  if(r){
    const c=sigCls(r.rssi);
    ssidHint.style.display='block';
    ssidHint.innerHTML=`訊號強度：<span class="sbadge ${c}">${r.rssi} dBm　${sigBar(r.rssi)}</span>`;
  } else {ssidHint.style.display='none';}
}
ssidSelect.addEventListener('change',onSsidChange);

function getSSID(){return ssidSelect.value==='__manual__'?customSsid.value.trim():ssidSelect.value;}
function setStatus(s,t){dot.className=`dot ${s}`;statusText.textContent=t;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ── Connect
btnConnect.addEventListener('click',async()=>{
  if(connected){disconnect();return;}
  if(!navigator.bluetooth)return;
  try{
    setStatus('connecting','掃描中...');
    btnConnect.disabled=true;
    log('開始掃描 SmartGate 裝置...','info');
    device=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'SG-'}], optionalServices:[SVC_UUID]
    });
    device.addEventListener('gattserverdisconnected',onDisconnected);
    setStatus('connecting',`連線中 ${device.name}...`);
    log(`找到：${device.name}，連線中...`,'info');
    server=await device.gatt.connect();
    const svc=await server.getPrimaryService(SVC_UUID);
    chars.ssid   =await svc.getCharacteristic(SSID_UUID);
    chars.pass   =await svc.getCharacteristic(PASS_UUID);
    chars.cmd    =await svc.getCharacteristic(CMD_UUID);
    chars.status =await svc.getCharacteristic(STATUS_UUID);
    chars.scan   =await svc.getCharacteristic(SCAN_UUID);
    chars.mqttUser =await svc.getCharacteristic(MQTT_USER_UUID);
    chars.mqttPass =await svc.getCharacteristic(MQTT_PASS_UUID);
    chars.devId    =await svc.getCharacteristic(DEV_ID_UUID);
    chars.email    =await svc.getCharacteristic(EMAIL_UUID);
    chars.serverNo =await svc.getCharacteristic(SERVER_NO_UUID);

    // 讀取現有設定
    const decoder = new TextDecoder();
    try{ currentSsid = decoder.decode(await chars.ssid.readValue()).trim(); }catch(e){}
    try{ $('mqttUser').value = decoder.decode(await chars.mqttUser.readValue()).trim(); }catch(e){}
    try{ $('deviceId').value = decoder.decode(await chars.devId.readValue()).trim(); }catch(e){}
    try{ $('userEmail').value = decoder.decode(await chars.email.readValue()).trim(); }catch(e){}
    try{ $('serverNo').value = decoder.decode(await chars.serverNo.readValue()).trim(); }catch(e){}
    // 密碼不可讀，保持空白

    if(currentSsid) log(`裝置目前 SSID：${currentSsid}`,'ok');

    await chars.status.startNotifications();
    chars.status.addEventListener('characteristicvaluechanged',e=>{
      const msg=decoder.decode(e.target.value);
      if(msg==='APPLYING'){log('裝置儲存設定中，即將重啟...','warn');btnSend.disabled=true;}
      else if(msg.startsWith('ERROR')){log(`裝置錯誤：${msg}`,'err');}
    });

    await chars.scan.startNotifications();
    chars.scan.addEventListener('characteristicvaluechanged',e=>{
      const raw=decoder.decode(e.target.value).trim();
      if(raw.startsWith('SCAN_DONE:')){
        const cnt=parseInt(raw.split(':')[1])||0;
        log(`掃描完成，找到 ${cnt} 個網路`,'ok');
        setScanBusy(false);
        buildDropdown();
      } else if(raw!=='IDLE'){
        const p=raw.split('|');
        if(p.length===2){
          const ssid=p[0], rssi=parseInt(p[1]);
          if(ssid&&!scanResults.find(r=>r.ssid===ssid)) scanResults.push({ssid,rssi});
        }
      }
    });

    connected=true;
    setStatus('connected',`已連線：${device.name}`);
    btnConnect.textContent='斷線'; btnConnect.disabled=false;
    btnSend.disabled=false; btnScan.disabled=false;
    log('連線成功！正在自動掃描附近 WiFi...','ok');
    await doScan();
  }catch(err){
    setStatus('error','連線失敗');
    log(`錯誤：${err.message}`,'err');
    btnConnect.disabled=false;
  }
});

async function doScan(){
  if(!connected||!chars.cmd)return;
  scanResults=[];
  setScanBusy(true);
  ssidSelect.innerHTML='<option value="">掃描中...</option>';
  ssidSelect.disabled=true;
  ssidHint.style.display='none';
  customWrap.style.display='none';
  log('請求裝置掃描附近 WiFi...','info');
  try{await chars.cmd.writeValue(new TextEncoder().encode('scan'));}
  catch(e){log(`掃描請求失敗：${e.message}`,'err');setScanBusy(false);}
}
btnScan.addEventListener('click',doScan);

function setScanBusy(b){
  btnScan.disabled=b; btnScan.classList.toggle('scanning',b);
  btnScan.lastChild.textContent=b?' 掃描中':' 掃描';
}

// ── Apply
btnSend.addEventListener('click',async()=>{
  const ssid=getSSID(), pass=passInput.value;
  if(!ssid){log('請選擇或輸入 WiFi 名稱','err');return;}
  if(!connected){log('請先連線至裝置','err');return;}
  try{
    btnSend.disabled=true;
    const enc=new TextEncoder();
    log(`傳送 SSID：${ssid}`,'info');
    await chars.ssid.writeValue(enc.encode(ssid)); await sleep(300);
    log('傳送 WiFi 密碼...','info');
    await chars.pass.writeValue(enc.encode(pass)); await sleep(300);

    // 傳送供裝參數
    const mqttUser = $('mqttUser').value.trim();
    if(mqttUser) { await chars.mqttUser.writeValue(enc.encode(mqttUser)); await sleep(200); }
    const mqttPass = $('mqttPass').value;
    if(mqttPass)  { await chars.mqttPass.writeValue(enc.encode(mqttPass)); await sleep(200); }
    const devId    = $('deviceId').value.trim();
    if(devId)     { await chars.devId.writeValue(enc.encode(devId)); await sleep(200); }
    const email    = $('userEmail').value.trim();
    if(email)     { await chars.email.writeValue(enc.encode(email)); await sleep(200); }
    const serverNo = $('serverNo').value.trim();
    if(serverNo)  { await chars.serverNo.writeValue(enc.encode(serverNo)); await sleep(200); }

    log('傳送 apply 指令...','info');
    await chars.cmd.writeValue(enc.encode('apply'));
    log('已送出！裝置重啟後將套用新設定','ok');
  }catch(err){log(`傳送失敗：${err.message}`,'err');btnSend.disabled=false;}
});

function onDisconnected(){
  connected=false; setStatus('','已斷線');
  btnConnect.textContent='連線'; btnConnect.disabled=false;
  btnSend.disabled=true; btnScan.disabled=true;
  ssidSelect.innerHTML='<option value="">── 請先連線裝置 ──</option>';
  ssidSelect.disabled=true; customWrap.style.display='none'; ssidHint.style.display='none';
  setScanBusy(false);
  log('BLE 連線已中斷','warn');
}
function disconnect(){if(device&&device.gatt.connected)device.gatt.disconnect();}

// Eye toggle
function toggleEye(fieldId, iconId, btn){
  const inp=document.getElementById(fieldId);
  const icon=document.getElementById(iconId);
  if(inp.type==='password'){
    inp.type='text';
    icon.innerHTML=`<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="1" y1="1" x2="23" y2="23"/>`;
  } else {
    inp.type='password';
    icon.innerHTML=`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }
}
$('eyeBtn').addEventListener('click',()=>toggleEye('passInput','eyeIcon'));
$('eyeBtn2').addEventListener('click',()=>toggleEye('mqttPass','eyeIcon2'));
</script>
</body>
</html>
